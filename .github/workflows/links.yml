name: Check links
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
  pull_request:
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --accept 200,206,403,429,999 --max-retries 2 './**/*.md'
          fail: false
